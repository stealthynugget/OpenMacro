name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew :core:model:test :core:engine:testDebugUnitTest
      - name: Build both flavors
        run: ./gradlew assembleOfflineDebug assembleOnlineDebug
      - name: Verify the offline flavor has no INTERNET permission
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          if $AAPT2 dump permissions app/build/outputs/apk/offline/debug/app-offline-debug.apk | grep -q "android.permission.INTERNET"; then
            echo "Offline flavor must not declare INTERNET"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
